AWSTemplateFormatVersion: '2010-09-09'

Description: 'Nested CloudFormation template to create an SQS Queue with flexible configuration for Standard or FIFO queue types and cross-account access'

Parameters:
  ProjectName:
    Type: String
    Default: 'proj-ztc'
    Description: Project name to use as queue prefix
    MinLength: 1
    MaxLength: 20
    AllowedPattern: "^[a-z0-9-]+$"
    ConstraintDescription: Project name must be lowercase letters, numbers, and hyphens only

  QueueBaseName:
    Type: String
    Default: 'sqs-queue'
    Description: Base name for the SQS queue (environment and region will be appended)

  Environment:
    Type: String
    Default: 'devl'
    Description: Deployment environment for the SQS queue

  CiSuffix:
    Type: String
    Default: ''
    Description: Optional CI suffix to append to the queue name

  QueueType:
    Type: String
    Default: Standard
    AllowedValues: [Standard, FIFO]
    Description: Type of SQS queue (Standard or FIFO)

  VisibilityTimeout:
    Type: Number
    Default: 30
    MinValue: 0
    MaxValue: 43200
    Description: Visibility timeout in seconds (0-43200)

  MessageRetentionPeriod:
    Type: Number
    Default: 345600
    MinValue: 60
    MaxValue: 1209600
    Description: Message retention period in seconds (60 seconds to 14 days)

  ReceiveMessageWaitTimeSeconds:
    Type: Number
    Default: 0
    MinValue: 0
    MaxValue: 20
    Description: Long polling wait time in seconds (0-20). Set to >0 to enable long polling

  CrossAccountArns:
    Type: CommaDelimitedList
    Default: ''
    Description: Comma-separated list of cross-account principal ARNs (e.g., arn:aws:iam::123456789012:root) to grant SendMessage and ReceiveMessage permissions (leave empty for no cross-account access)

  EnableContentBasedDeduplication:
    Type: String
    Default: 'false'
    AllowedValues: ['true', 'false']
    Description: Enable content-based deduplication (FIFO queues only)

Conditions:
  HasCiSuffix: !Not [!Equals [!Ref CiSuffix, ""]]
  IsFifoQueue: !Equals [!Ref QueueType, FIFO]
  HasCrossAccountArns: !Not [!Equals [!Join ['', !Ref CrossAccountArns], ""]]
  EnableContentDedup: !Equals [!Ref EnableContentBasedDeduplication, 'true']
  EnableContentDedupForFifo: !And
    - !Condition IsFifoQueue
    - !Condition EnableContentDedup

Resources:
  SQSQueue:
    DeletionPolicy: Delete
    UpdateReplacePolicy: Delete
    Type: AWS::SQS::Queue
    Properties:
      QueueName: !If
        - IsFifoQueue
        - !If
          - HasCiSuffix
          - !Sub '${ProjectName}-${QueueBaseName}-${Environment}-${AWS::Region}-${CiSuffix}.fifo'
          - !Sub '${ProjectName}-${QueueBaseName}-${Environment}-${AWS::Region}.fifo'
        - !If
          - HasCiSuffix
          - !Sub '${ProjectName}-${QueueBaseName}-${Environment}-${AWS::Region}-${CiSuffix}'
          - !Sub '${ProjectName}-${QueueBaseName}-${Environment}-${AWS::Region}'
      VisibilityTimeout: !Ref VisibilityTimeout
      MessageRetentionPeriod: !Ref MessageRetentionPeriod
      ReceiveMessageWaitTimeSeconds: !Ref ReceiveMessageWaitTimeSeconds
      FifoQueue: !If [IsFifoQueue, true, false]
      ContentBasedDeduplication: !If [EnableContentDedupForFifo, true, !Ref AWS::NoValue]
      Tags:
        - Key: Environment
          Value: !Ref Environment
        - Key: ManagedBy
          Value: CloudFormation

  SQSQueuePolicy:
    Type: AWS::SQS::QueuePolicy
    Properties:
      Queues:
        - !Ref SQSQueue
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: AllowSameAccountAccess
            Effect: Allow
            Principal:
              AWS: !Sub 'arn:${AWS::Partition}:iam::${AWS::AccountId}:root'
            Action:
              - sqs:SendMessage
              - sqs:ReceiveMessage
              - sqs:DeleteMessage
              - sqs:GetQueueAttributes
              - sqs:GetQueueUrl
            Resource: !GetAtt SQSQueue.Arn
          - !If
            - HasCrossAccountArns
            - Sid: AllowCrossAccountAccess
              Effect: Allow
              Principal:
                AWS: !Ref CrossAccountArns
              Action:
                - sqs:SendMessage
                - sqs:ReceiveMessage
              Resource: !GetAtt SQSQueue.Arn
            - !Ref AWS::NoValue

Outputs:
  QueueName:
    Description: Name of the SQS queue
    Value: !GetAtt SQSQueue.QueueName
    Export:
      Name: !Sub "${AWS::StackName}-QueueName"

  QueueUrl:
    Description: URL of the SQS queue
    Value: !Ref SQSQueue
    Export:
      Name: !Sub "${AWS::StackName}-QueueUrl"

  QueueArn:
    Description: ARN of the SQS queue
    Value: !GetAtt SQSQueue.Arn
    Export:
      Name: !Sub "${AWS::StackName}-QueueArn"

  QueueType:
    Description: Type of the SQS queue (Standard or FIFO)
    Value: !Ref QueueType
    Export:
      Name: !Sub "${AWS::StackName}-QueueType"